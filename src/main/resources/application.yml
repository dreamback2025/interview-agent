server:
  port: 8080

spring:
  application:
    name: interview-agent

  # 默认数据源：H2（MySQL 兼容模式，文件落盘），零依赖跑通闭环
  datasource:
    url: jdbc:h2:file:./data/interviewdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # DeepSeek（OpenAI 协议兼容）
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # 从环境变量读取：DEEPSEEK_API_KEY=sk-xxx ./run.sh
      # 未配置或仍是占位符时自动降级为离线桩模式（见 LlmConfig），不会启动失败
      # ⚠️ 这个值必须**始终非空**：Spring AI 的 openAiApi bean 会 Assert.hasText(api-key)，
      # 一旦为空，应用在启动阶段就崩（走不到 LlmConfig 的 stub 分支）。
      #
      # 两个坑（都实测过）：
      # 1) Spring 占位符 ${VAR:默认} 只在变量「未设置」时回退 —— 变量被设成**空字符串**
      #    （如 docker compose 的 ${VAR:-}）时不回退，于是 api-key 变空 → 崩；
      # 2) Spring 不认 shell 的 :- 语法，写成 ${VAR:-默认} 会把 '-' 当成默认值的一部分
      #    （例如 ${RAG_ENABLED:-true} 的默认值变成字符串 "-true"，布尔解析直接失败）。
      #
      # 结论：靠「调用方保证传入非空占位符」来解决 —— 见 docker-compose.yml 里的
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder-not-set}
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder-not-set}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.3
    # 注意缩进：ollama 是 spring.ai 的子节点，不能缩进成 openai 的子节点，
    # 否则 spring.ai.ollama.* 全部失效，embedding 会退回 Ollama 默认模型（mxbai-embed-large）
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}
    # 多个模型提供方并存时必须指定，否则 ChatClient/EmbeddingModel 会有多个候选
    model:
      chat: openai
      embedding: ollama

app:
  llm:
    # 显式强制离线桩模式（未配置 Key 时也会自动降级）
    stub: ${LLM_STUB:false}
  jd:
    # JD 提炼用的技术关键词（原先硬编码在 InterviewTools 里的 TECH_KEYWORDS）。
    # 留空也不会失效 —— 会退化为「知识库标签」这个动态来源；两者都为空时才切分职责短语。
    keywords: ${JD_KEYWORDS:Java,JVM,GC,并发,多线程,线程池,锁,MySQL,索引,SQL,事务,Redis,缓存,Spring,Spring Boot,MyBatis,Kafka,MQ,消息队列,分布式,微服务,Docker,Kubernetes,Linux,网络,HTTP,TCP,算法,数据结构,设计模式,操作系统,高并发,性能调优,Elasticsearch}
    # 把「用户自己导入的笔记标签」也作为关键词来源 —— 面 Java 的人得到 Java 系的词，
    # 面 Go 的人得到 Go 系的词，且补一篇新领域的笔记词库就自动扩展了
    dynamic-tags: ${JD_DYNAMIC_TAGS:true}
    # 提炼结果最多返回多少条（防止长 JD 输出爆炸）
    max-requirements: ${JD_MAX_REQUIREMENTS:12}
    # 标签不常变，但默认不缓存 —— 否则用户刚补的笔记要等缓存过期才生效（见 JdProperties 注释）
    keywords-cache-ms: ${JD_KEYWORDS_CACHE_MS:0}
  security:
    # 鉴权总开关：true = JWT 无状态鉴权；false = 全部放行（单用户自用/本地调试）
    enabled: ${SECURITY_ENABLED:true}
    jwt:
      # ⚠️ 默认值仅供本地开发，生产必须用环境变量覆盖：
      #    export JWT_SECRET="$(openssl rand -base64 48)"
      # HS256 要求密钥 ≥ 32 字节，太短会在启动时直接报错（快速失败，而不是悄悄用弱密钥）
      secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789abcdef}
      ttl-seconds: ${JWT_TTL:86400}
  demo-user:
    # 启动时确保存在演示账号（demo/demo123），便于开箱验证鉴权链路；生产建议关闭
    enabled: ${DEMO_USER_ENABLED:true}
  debug:
    # /api/debug/* 调试端点（会暴露连接串与注入给模型的 prompt 原文）
    # 对外部署时设为 false 或只在内网开启
    enabled: ${DEBUG_ENDPOINTS:true}
  memory:
    # 会话记忆：把其他历次面试的复盘结论注入当前分析（数据来自 interview_analysis 表，不依赖 Redis）
    enabled: ${MEMORY_ENABLED:true}
  rag:
    # 关闭后不创建向量库相关 bean，其他功能照常可用
    enabled: ${RAG_ENABLED:true}
    dimensions: ${RAG_DIMENSIONS:1024}   # bge-m3 = 1024
    # ollama = 真实语义 embedding（bge-m3）；stub = 哈希兜底，不依赖 Ollama，仅用于验证链路
    embedding: ${RAG_EMBEDDING:ollama}
    hybrid:
      # 混合检索：向量语义 + 关键词（tsvector + GIN）+ RRF 融合。
      # 关键词通道不可用（业务库与向量库不同库）时自动退化为纯向量，不会让检索失败。
      enabled: ${RAG_HYBRID_ENABLED:true}
    gate:
      # 相关性闸门：检索结果不足以回答时返回 confident=false（拒答），而不是硬答。
      # 不用单一相似度阈值 —— 实测正样本最低 38.3% vs 难负样本最高 80.1%，重叠 41.8 个百分点；
      # 改用「向量相似度 + 关键词命中数」双信号（见 RagRelevanceGate）。
      enabled: ${RAG_GATE_ENABLED:true}
      # 阈值由评测集的阈值网格搜索得到（scripts/eval/run-eval.py）：
      #   这组值下 正样本漏答 4/40=10%、L1 拒 16/19=84%、L2~L4 拒 8/15=53%
      vec-low: ${RAG_GATE_VEC_LOW:0.40}
      vec-mid: ${RAG_GATE_VEC_MID:0.58}
      # 关键词覆盖率下限：查询分词后落在 top1 文档里的 token 占比。
      # 不用「命中文档数」—— OR 查询下通用词会污染它（实测正负样本都 6~15，无区分度）。
      cov-low: ${RAG_GATE_COV_LOW:0.15}
      cov-mid: ${RAG_GATE_COV_MID:0.35}
    vectordb:
      url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/interview_vector}
      username: ${VECTOR_DB_USER:postgres}
      password: ${VECTOR_DB_PASSWORD:}
  cache:
    # 分析结果与检索结果缓存。Redis 不可用时自动跳过缓存，主流程不受影响
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:30m}
  async:
    # 分析任务异步化：mq = RabbitMQ；pool = 本地线程池（无 MQ 时自动降级）
    enabled: ${ASYNC_ENABLED:true}
    mode: ${ASYNC_MODE:mq}
    queue: ${ASYNC_QUEUE:analysis.task.queue}
  ratelimit:
    # 按用户维度限流，保护模型配额与成本（Redis 不可用时自动降级放行）
    enabled: ${RATELIMIT_ENABLED:true}
    qpm: ${RATELIMIT_QPM:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # Redis / MQ 是「可降级组件」：它们挂掉时应用仍可用，不应让整体存活判定失败
    redis:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.hibernate.SQL: warn
  # 日志级别字段带 traceId（MDC 由 TraceIdFilter 注入，未设置时显示空）
  pattern:
    level: '%-5level [%X{traceId:-}]'
