server:
  port: 8080
  tomcat:
    threads:
      # 显式写出来，别吃默认值：这个数字要和「LLM 并发上限 × 平均耗时」对齐，
      # 太小会平白拒绝请求，太大则会把上游和数据库连接池一起压垮。
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE:20}
    # 队列满后直接拒绝连接，而不是让请求无限排队
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

spring:
  application:
    name: interview-agent

  # 默认数据源：H2（MySQL 兼容模式，文件落盘），零依赖跑通闭环
  datasource:
    url: jdbc:h2:file:./data/interviewdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # 连接池必须显式配置：默认只有 10 个连接，而分析接口一次要跑几十秒，
    # 十来个并发就能把池子抽干，后续请求全部卡在 getConnection() 上。
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 拿不到连接时快速失败（默认 30s 太长了）：与其让所有请求一起干等半分钟，
      # 不如早点返回错误，把容量留给已经进来的请求。
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 消费者并发默认是 1 —— 意味着异步分析通道的吞吐被钉死在「一次一个」，
        # 比同步接口还慢一个数量级。这里放开到 4~16。
        concurrency: ${MQ_CONSUMER_MIN:4}
        max-concurrency: ${MQ_CONSUMER_MAX:16}
        # ⚠️ prefetch 必须跟着 concurrency 一起改：默认 250 会让第一个消费者
        # 一口气把 250 条消息抓进本地内存，其余消费者无活可干，扩容等于没扩。
        # 取值 ≈ 单消费者并发上限（每个消费者手上有几条在飞）。
        prefetch: ${MQ_PREFETCH:4}

  # DeepSeek（OpenAI 协议兼容）
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # 从环境变量读取：DEEPSEEK_API_KEY=sk-xxx ./run.sh
      # 未配置或仍是占位符时自动降级为离线桩模式（见 LlmConfig），不会启动失败
      # ⚠️ 这个值必须**始终非空**：Spring AI 的 openAiApi bean 会 Assert.hasText(api-key)，
      # 一旦为空，应用在启动阶段就崩（走不到 LlmConfig 的 stub 分支）。
      #
      # 两个坑（都实测过）：
      # 1) Spring 占位符 ${VAR:默认} 只在变量「未设置」时回退 —— 变量被设成**空字符串**
      #    （如 docker compose 的 ${VAR:-}）时不回退，于是 api-key 变空 → 崩；
      # 2) Spring 不认 shell 的 :- 语法，写成 ${VAR:-默认} 会把 '-' 当成默认值的一部分
      #    （例如 ${RAG_ENABLED:-true} 的默认值变成字符串 "-true"，布尔解析直接失败）。
      #
      # 结论：靠「调用方保证传入非空占位符」来解决 —— 见 docker-compose.yml 里的
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder-not-set}
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder-not-set}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.3
    # 注意缩进：ollama 是 spring.ai 的子节点，不能缩进成 openai 的子节点，
    # 否则 spring.ai.ollama.* 全部失效，embedding 会退回 Ollama 默认模型（mxbai-embed-large）
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}
    # 多个模型提供方并存时必须指定，否则 ChatClient/EmbeddingModel 会有多个候选
    model:
      chat: openai
      embedding: ollama

app:
  llm:
    # 显式强制离线桩模式（未配置 Key 时也会自动降级）
    stub: ${LLM_STUB:false}
    # 同步调用的等待上限。Spring AI 默认没有读超时，上游挂起会永久占住线程与连接，
    # 这是唯一能把系统从「慢」拖到「死」的路径。超时后返回 504。
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    circuit:
      # 上游熔断：超时管「单次最多等多久」，熔断管「这段时间干脆别调」。
      # 上游故障的典型表现是所有请求都变慢 —— 只靠超时，每个请求仍会占满 60s 才释放，
      # 用户重试又把新请求灌进来，最后所有槽位都在等一个已经死了的上游。
      enabled: ${LLM_CB_ENABLED:true}
      # 窗口内失败率超过这个值（百分比）才开路
      failure-rate: ${LLM_CB_FAILURE_RATE:50}
      # 最小样本数：只调了 1 次就失败，失败率是 100%，但不能因此开路。
      # 取值越大越不容易误判，代价是故障时要多牺牲几个请求才触发保护。
      min-samples: ${LLM_CB_MIN_SAMPLES:5}
      # 连续失败这么多次就开路 —— 与失败率并列，任一路成立即开路。
      # 为什么不能只靠失败率（实测教训）：上游不可达时每次要等满 60s 超时才失败，
      # 若窗口长度小于单次耗时，下一次调用时窗口已被整个滑空，样本永远攒不够，
      # 失败率统计彻底失效（实测连发 4 次全部各等 61s，一次都没开路）。
      # 连续失败计数不受窗口滑动影响，专治这种「慢失败」。
      consecutive-failures: ${LLM_CB_CONSECUTIVE:3}
      # ⚠️ 窗口必须显著大于单次最大耗时（超时上限），否则统计会被自己的慢调用冲掉
      window-ms: ${LLM_CB_WINDOW_MS:300000}
      # 开路后等这么久才放探测请求
      open-wait-ms: ${LLM_CB_OPEN_WAIT_MS:30000}
      # 半开期放行几个探测请求。不能全放 —— 上游刚恢复就被瞬间打垮（雪崩）
      half-open-permits: ${LLM_CB_HALF_OPEN_PERMITS:2}
      # 开路时是否退回启发式结果（stubData）。默认 false：
      # 悄悄返回低质量分析会让「分析成功」这个信号本身失去可信度，宁可显式报错。
      fallback-heuristic: ${LLM_CB_FALLBACK:false}
  jd:
    # JD 提炼用的技术关键词（原先硬编码在 InterviewTools 里的 TECH_KEYWORDS）。
    # 留空也不会失效 —— 会退化为「知识库标签」这个动态来源；两者都为空时才切分职责短语。
    keywords: ${JD_KEYWORDS:Java,JVM,GC,并发,多线程,线程池,锁,MySQL,索引,SQL,事务,Redis,缓存,Spring,Spring Boot,MyBatis,Kafka,MQ,消息队列,分布式,微服务,Docker,Kubernetes,Linux,网络,HTTP,TCP,算法,数据结构,设计模式,操作系统,高并发,性能调优,Elasticsearch}
    # 把「用户自己导入的笔记标签」也作为关键词来源 —— 面 Java 的人得到 Java 系的词，
    # 面 Go 的人得到 Go 系的词，且补一篇新领域的笔记词库就自动扩展了
    dynamic-tags: ${JD_DYNAMIC_TAGS:true}
    # 提炼结果最多返回多少条（防止长 JD 输出爆炸）
    max-requirements: ${JD_MAX_REQUIREMENTS:12}
    # 标签不常变，但默认不缓存 —— 否则用户刚补的笔记要等缓存过期才生效（见 JdProperties 注释）
    keywords-cache-ms: ${JD_KEYWORDS_CACHE_MS:0}
  security:
    # 鉴权总开关：true = JWT 无状态鉴权；false = 全部放行（单用户自用/本地调试）
    enabled: ${SECURITY_ENABLED:true}
    jwt:
      # ⚠️ 默认值仅供本地开发，生产必须用环境变量覆盖：
      #    export JWT_SECRET="$(openssl rand -base64 48)"
      # HS256 要求密钥 ≥ 32 字节，太短会在启动时直接报错（快速失败，而不是悄悄用弱密钥）
      secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789abcdef}
      ttl-seconds: ${JWT_TTL:86400}
  demo-user:
    # 启动时确保存在演示账号（demo/demo123），便于开箱验证鉴权链路；生产建议关闭
    enabled: ${DEMO_USER_ENABLED:true}
  debug:
    # /api/debug/* 调试端点（会暴露连接串与注入给模型的 prompt 原文）
    # 对外部署时设为 false 或只在内网开启
    enabled: ${DEBUG_ENDPOINTS:true}
  memory:
    # 会话记忆：把其他历次面试的复盘结论注入当前分析（数据来自 interview_analysis 表，不依赖 Redis）
    enabled: ${MEMORY_ENABLED:true}
  rag:
    # 关闭后不创建向量库相关 bean，其他功能照常可用
    enabled: ${RAG_ENABLED:true}
    dimensions: ${RAG_DIMENSIONS:1024}   # bge-m3 = 1024
    # ollama = 真实语义 embedding（bge-m3）；stub = 哈希兜底，不依赖 Ollama，仅用于验证链路
    embedding: ${RAG_EMBEDDING:ollama}
    hybrid:
      # 混合检索：向量语义 + 关键词（tsvector + GIN）+ RRF 融合。
      # 关键词通道不可用（业务库与向量库不同库）时自动退化为纯向量，不会让检索失败。
      enabled: ${RAG_HYBRID_ENABLED:true}
    gate:
      # 相关性闸门：检索结果不足以回答时返回 confident=false（拒答），而不是硬答。
      # 不用单一相似度阈值 —— 实测正样本最低 38.3% vs 难负样本最高 80.1%，重叠 41.8 个百分点；
      # 改用「向量相似度 + 关键词命中数」双信号（见 RagRelevanceGate）。
      enabled: ${RAG_GATE_ENABLED:true}
      # 阈值由评测集的阈值网格搜索得到（scripts/eval/run-eval.py）：
      #   这组值下 正样本漏答 4/40=10%、L1 拒 16/19=84%、L2~L4 拒 8/15=53%
      vec-low: ${RAG_GATE_VEC_LOW:0.40}
      vec-mid: ${RAG_GATE_VEC_MID:0.58}
      # 关键词覆盖率下限：查询分词后落在 top1 文档里的 token 占比。
      # 不用「命中文档数」—— OR 查询下通用词会污染它（实测正负样本都 6~15，无区分度）。
      cov-low: ${RAG_GATE_COV_LOW:0.15}
      cov-mid: ${RAG_GATE_COV_MID:0.35}
    vectordb:
      url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/interview_vector}
      username: ${VECTOR_DB_USER:postgres}
      password: ${VECTOR_DB_PASSWORD:}
  cache:
    # 分析结果与检索结果缓存。Redis 不可用时自动跳过缓存，主流程不受影响
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:30m}
  async:
    # 分析任务异步化：mq = RabbitMQ；pool = 本地线程池（无 MQ 时自动降级）
    enabled: ${ASYNC_ENABLED:true}
    mode: ${ASYNC_MODE:mq}
    queue: ${ASYNC_QUEUE:analysis.task.queue}
    # 悬挂任务回收：任务可能因为实例崩溃 / 消息丢失 / 线程池拒绝而永远停在 PENDING。
    # 没有这个扫描，前端会一直轮询一个不可能完成的任务。
    # 阈值必须显著大于单次分析的最大耗时（模型超时 60s + 笔记检索），否则会误判正常执行的任务。
    stuck-timeout-minutes: ${ASYNC_STUCK_MINUTES:10}
    # 重投几次后放弃（claim 时 retryCount+1，所以这个值就是「最多执行几次」）
    max-retry: ${ASYNC_MAX_RETRY:2}
    reaper-interval-ms: ${ASYNC_REAPER_INTERVAL_MS:120000}
  ratelimit:
    # 按用户维度限流。Redis 不可用时各维度自动降级放行（限流挂了不该让用户用不了功能）
    enabled: ${RATELIMIT_ENABLED:true}
    # 阈值外置：调限流不用改代码重新发版。
    #   defaults —— 兜底规则；rules —— 按「类短名.方法名」精确覆盖
    #   max-in-flight 是「同时在飞数」，比 qpm 更能保护线程池/连接池：
    #   qpm 限的是速率，而真正占资源的是同时在跑的数量，耗时一变速率的含义就变了。
    defaults:
      qpm: ${RATELIMIT_QPM:60}
      max-in-flight: ${RATELIMIT_MAX_IN_FLIGHT:2}
      global-qpm: ${RATELIMIT_GLOBAL_QPM:0}
      global-in-flight: ${RATELIMIT_GLOBAL_IN_FLIGHT:32}
    rules:
      # 分析最重（一次几十秒），单用户并发压到 2
      InterviewController.analyze: {qpm: 20, max-in-flight: 2}
      # Agent 版要跑多轮工具调用，更重
      InterviewController.agentAnalyze: {qpm: 10, max-in-flight: 1}
      InterviewController.analysisStream: {qpm: 10, max-in-flight: 2}
      MockController.start: {qpm: 5, max-in-flight: 1}
      MockController.answer: {qpm: 20, max-in-flight: 2}
      MockController.finish: {qpm: 10, max-in-flight: 1}
      # 登录/注册：未登录用户共用 anonymous 维度（等效全局），挡住口令爆破。
      # 多人同时注册的场景会互相挤 —— 正式部署应改成按 IP 维度。
      AuthController.login: {qpm: 20, max-in-flight: 0}
      AuthController.register: {qpm: 5, max-in-flight: 0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # Redis / MQ 是「可降级组件」：它们挂掉时应用仍可用，不应让整体存活判定失败
    redis:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # ⚠️ 不开这个，Prometheus 里只有 count/sum/max —— 能算平均值，但算不出分位数。
      # 耗时是长尾分布（上游偶尔抽风），均值会严重低估真实体验。
      #   percentiles-histogram → 输出 le 分桶，跨实例可聚合：
      #     histogram_quantile(0.95, sum(rate(llm_call_duration_seconds_bucket[5m])) by (le))
      #   P50/P95 的直读值（quantile 标签）在 LlmMetricsAspect 里用 publishPercentiles 声明 ——
      #   实测 management.metrics.distribution.percentiles 这个配置项对 Timer 不生效。
      percentiles-histogram:
        llm_call_duration: true

logging:
  level:
    org.hibernate.SQL: warn
  # 日志级别字段带 traceId（MDC 由 TraceIdFilter 注入，未设置时显示空）
  pattern:
    level: '%-5level [%X{traceId:-}]'
