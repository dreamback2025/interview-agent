name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 单元测试全部离线可跑：不依赖 DeepSeek / Ollama / PostgreSQL
      - name: Build & test
        run: ./mvnw -B -ntp verify
        env:
          LLM_STUB: "true"
          RAG_ENABLED: "false"
